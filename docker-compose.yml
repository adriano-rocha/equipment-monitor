version: "3.8"

services:
  # 1. Banco de Dados Local
  postgres:
    image: postgres:16-alpine
    container_name: asaph-postgres
    restart: always
    environment:
      POSTGRES_USER: equipment_monitor
      POSTGRES_PASSWORD: changeme_local_2026
      POSTGRES_DB: equipment_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipment_monitor -d equipment_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asaph-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://equipment_monitor:changeme_local_2026@postgres:5432/equipment_monitor
      JWT_SECRET: asaph_super_secret_local_jwt_key_2026_enterprise
      CORS_ORIGINS: "*"
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  # 3. Central de Controle / Dashboard Web (Nginx)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: asaph-dashboard
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
    driver: local