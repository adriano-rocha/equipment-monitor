<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equipment Monitor - Mobile Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 1.5rem; display: flex; flex-direction: column; min-height: 100vh; }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header h1 { font-size: 1.4rem; color: #38bdf8; }
    .header p { font-size: 0.85rem; color: #94a3b8; margin-top: 0.25rem; }
    .card { background: #1e293b; border-radius: 12px; padding: 1.25rem; border: 1px solid #334155; margin-bottom: 1rem; }
    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
    .status-active { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .status-alert { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .metric { display: flex; justify-content: space-between; margin-top: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #334155; font-size: 0.9rem; }
    .metric span:first-child { color: #94a3b8; }
    .metric span:last-child { font-weight: bold; color: #f8fafc; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    button { padding: 0.85rem; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-toggle { background: #0284c7; color: white; }
    .btn-alert { background: #dc2626; color: white; }
    .btn-battery { background: #d97706; color: white; }
    .log-box { background: #090d16; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem; font-family: monospace; font-size: 0.75rem; color: #38bdf8; height: 110px; overflow-y: auto; margin-top: auto; }
  </style>
</head>
<body>
  <div class="header">
    <h1>📡 Mobile GPS Agent</h1>
    <p>Dispositivo Real: <strong>CEL-REAL-01</strong></p>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.85rem; color: #94a3b8;">Status de Transmissão:</span>
      <div id="statusBadge" class="status-badge status-active">● Transmitindo GPS</div>
    </div>
    <div class="metric">
      <span>Latitude Real:</span>
      <span id="latDisplay">Obtendo...</span>
    </div>
    <div class="metric">
      <span>Longitude Real:</span>
      <span id="lngDisplay">Obtendo...</span>
    </div>
    <div class="metric">
      <span>Bateria Real do Aparelho:</span>
      <span id="batteryDisplay">Detectando...</span>
    </div>
    <div class="metric">
      <span>Velocidade Calculada:</span>
      <span id="speedDisplay">0.0 km/h</span>
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-toggle" id="toggleBtn" onclick="toggleTransmission()">Pausar Transmissão</button>
    <button type="button" class="btn-alert" onclick="simulateBreach()">🚨 Simular Rompimento de Cerca (+450m)</button>
    <button type="button" class="btn-battery" onclick="simulateLowBattery()">🪫 Simular Bateria Crítica (7%)</button>
  </div>

  <div style="margin-top: 1rem; font-size: 0.8rem; color: #94a3b8; text-align: center;">Últimas Respostas da API (Render):</div>
  <div class="log-box" id="logBox">Iniciando conexão segura com a Render...</div>

  <script>
    const API_URL = "https://equipment-monitor-fd2u.onrender.com/api/v1/heartbeats";
    const AUTH_HEADER = "DeviceKey key_5101cc58:sec_12f9d0dd75aebf1e";

    let isTransmitting = true;
    let currentCoords = { lat: -23.6477, lng: -46.6292 };
    let currentBattery = 85;
    let currentSpeed = 0.0;
    let isOffsetBreach = false;

    const logBox = document.getElementById("logBox");
    function log(msg) {
      const now = new Date().toLocaleTimeString();
      logBox.innerHTML = `[${now}] ${msg}<br>` + logBox.innerHTML;
    }

    // 1. Tenta capturar o hardware de bateria real do smartphone
    if (navigator.getBattery) {
      navigator.getBattery().then(batt => {
        currentBattery = Math.round(batt.level * 100);
        document.getElementById("batteryDisplay").innerText = currentBattery + "%";
        batt.addEventListener("levelchange", () => {
          currentBattery = Math.round(batt.level * 100);
          document.getElementById("batteryDisplay").innerText = currentBattery + "%";
        });
      });
    } else {
      document.getElementById("batteryDisplay").innerText = currentBattery + "% (Padrão)";
    }

    // 2. Captura o GPS físico real via hardware do smartphone
    if ("geolocation" in navigator) {
      navigator.geolocation.watchPosition(
        (pos) => {
          if (!isOffsetBreach) {
            currentCoords.lat = pos.coords.latitude;
            currentCoords.lng = pos.coords.longitude;
            currentSpeed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : "0.0";
            
            document.getElementById("latDisplay").innerText = currentCoords.lat.toFixed(5);
            document.getElementById("lngDisplay").innerText = currentCoords.lng.toFixed(5);
            document.getElementById("speedDisplay").innerText = currentSpeed + " km/h";
          }
        },
        (err) => {
          log("Erro GPS: " + err.message + ". Usando coordenadas base.");
        },
        { enableHighAccuracy: true, maximumAge: 2000, timeout: 10000 }
      );
    }

    // 3. Loop periódico de envio a cada 4 segundos
    async function sendHeartbeat() {
      if (!isTransmitting) return;

      const payload = {
        latitude: parseFloat(currentCoords.lat),
        longitude: parseFloat(currentCoords.lng),
        battery_level: parseInt(currentBattery),
        speed_kmh: parseFloat(currentSpeed) || 0.0
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": AUTH_HEADER
          },
          body: JSON.stringify(payload)
        });

        if (res.status === 201) {
          log(`✓ Enviado 201 Created: Bat: ${currentBattery}% | Lat: ${currentCoords.lat.toFixed(4)}`);
        } else {
          const errText = await res.text();
          log(`⚠️ Resposta ${res.status}: ${errText}`);
        }
      } catch (e) {
        log(`❌ Erro rede: ${e.message}`);
      }
    }

    setInterval(sendHeartbeat, 4000);

    function toggleTransmission() {
      isTransmitting = !isTransmitting;
      const btn = document.getElementById("toggleBtn");
      const badge = document.getElementById("statusBadge");
      if (isTransmitting) {
        btn.innerText = "Pausar Transmissão";
        badge.className = "status-badge status-active";
        badge.innerText = "● Transmitindo GPS";
      } else {
        btn.innerText = "Retomar Transmissão";
        badge.className = "status-badge status-alert";
        badge.innerText = "❚❚ Transmissão Pausada";
      }
    }

    function simulateBreach() {
      isOffsetBreach = true;
      // Desloca as coordenadas em ~450 metros para fora do perímetro
      currentCoords.lat += 0.0042;
      currentCoords.lng += 0.0038;
      currentSpeed = 38.5; // Simula evasão de carro
      document.getElementById("latDisplay").innerText = currentCoords.lat.toFixed(5) + " (EVASÃO)";
      document.getElementById("speedDisplay").innerText = "38.5 km/h";
      log("🚨 EVASÃO DISPARADA! Coordenadas deslocadas além de 250m.");
      sendHeartbeat();
    }

    function simulateLowBattery() {
      currentBattery = 7;
      document.getElementById("batteryDisplay").innerText = "7% (CRÍTICO)";
      log("🪫 Bateria ajustada para 7% para acionar o alerta crítico.");
      sendHeartbeat();
    }
  </script>
</body>
</html>
